services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: task-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_api_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task-api-network

  # Aplicación Node.js
  app:
    build: .
    container_name: task-api-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - task-api-network

volumes:
  postgres_data:

networks:
  task-api-network:
    driver: bridge
